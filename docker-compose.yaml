services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: app
    ports:
      - "8000:8000"
    command: python3 run.py
    networks:
      - tutorial_fastapi_api
    restart: always
    depends_on:
      - db
      - redis
      - rabbitmq
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app/app
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql
    container_name: db
    volumes:
      - ./data/mysql:/var/lib/mysql
    ports:
      - '3306:3306'
    env_file:
      - .env
    networks:
      - tutorial_fastapi_api
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

  redis:
    image: "redis:7.4.0-bookworm"
    container_name: redis
    env_file:
      - .env
    networks:
      - tutorial_fastapi_api
    ports:
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: "rabbitmq:3.13.6-management"
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    networks:
      - tutorial_fastapi_api
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
#    ports:
#      - "9000:8000"
    networks:
      - tutorial_fastapi_api
    command: [ "python", "app/utils/consumer.py" ]
    depends_on:
      - rabbitmq


networks:
  tutorial_fastapi_api:
    driver: bridge
