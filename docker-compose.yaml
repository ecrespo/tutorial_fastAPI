services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - TZ=America/Caracas
    container_name: app
    ports:
      - "8000:8000"
    command: python3 run.py
    networks:
      - tutorial_fastapi_api
    restart: always
    depends_on:
      - db
    volumes:
      - ./app:/app/app
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mongo:6.0.17
    container_name: db
    ports:
      - "27017:27017"
    restart: always
    networks:
      - tutorial_fastapi_api
#    volumes:
#      - type: volume
#        source: mongo-data
#        target: /data/db
#        volume:
#          nocopy: true
    environment:
      - TZ=America/Caracas
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
        - ./data/db:/data/db

